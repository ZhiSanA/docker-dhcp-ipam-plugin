# Docker Compose for DHCP IPAM Plugin Testing
#
# Defines everything inline — no pre-created networks needed.
# Just ensure the plugin is running (make plugin or standalone).
#
# Usage:
#   docker compose up -d           # Create network + start nginx
#   docker compose logs nginx      # Check nginx got a DHCP IP
#   docker compose down -v         # Clean up (removes network too)

services:
  nginx:
    image: nginx:alpine
    container_name: dhcp-test-nginx
    hostname: dhcp-test-nginx
    networks:
      - dhcp-net
    ports:
      - "8080:80"
    command:
      - sh
      - -c
      - |
        echo "=== Container started ==="
        echo "Hostname: $$(hostname)"
        echo "IP info:"
        ip addr show eth0 | grep 'inet '
        echo "Default route:"
        ip route show default
        echo "=== Starting nginx ==="
        nginx -g 'daemon off;'

networks:
  dhcp-net:
    driver: macvlan
    driver_opts:
      parent: wlan0
    ipam:
      driver: dhcp-ipam
